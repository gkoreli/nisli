<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>02-layout — intrinsic sizing / F9 class probe</title>
    <style>
      /* ══════════════════════════════════════════════════════════════════
         A faithful re-statement of experiments/c11-appearance/src/theme/,
         reduced to the parts this probe measures. No framework, no build.
         Every number below is copied from tokens.css / structure.css /
         roles.css so that the measurements are about THAT table.
         ══════════════════════════════════════════════════════════════════ */

      :root {
        --unit-base: 4px;
        --unit-scale: 1;
        --text-base: 14px;
        --text-meta-base: 12px;
        --text-scale: 1;
        --min-target: 0px;
        --min-avatar: 20px;
        --min-text: 11px;
        --min-track: 176px; /* tokens.css:70 */
        --s1: #fff;
        --fg: #111114;
        --line: #dededf;
      }

      /* tokens.css:111 — derived per element so axes compose. */
      * {
        --unit: calc(var(--unit-base) * var(--unit-scale));
        --text: calc(var(--text-base) * var(--text-scale));
        --text-meta: calc(var(--text-meta-base) * var(--text-scale));
        --radius: calc(var(--unit) * 2);
      }

      [data-density='comfortable'] { --unit-base: 4px; --text-base: 14px; --text-meta-base: 12px; }
      [data-density='compact']     { --unit-base: 3px; --text-base: 13px; --text-meta-base: 11px; }
      [data-density='dense']       { --unit-base: 2px; --text-base: 12px; --text-meta-base: 11px; }

      [data-input='pointer'] { --unit-scale: 1;    --text-scale: 1;    --min-target: 0px; }
      [data-input='touch']   { --unit-scale: 1.25; --text-scale: 1.08; --min-target: 44px; }

      /* roles.css:37 */
      [data-appearance], [data-text], [data-layout] { box-sizing: border-box; }

      /* roles.css:47 — the action role, with both halves of its floor. */
      [data-appearance='action'] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: calc(var(--unit) * 2);
        block-size: max(calc(var(--unit) * 9), var(--min-target));
        min-block-size: max(calc(var(--unit) * 9), var(--min-target));
        min-inline-size: var(--min-target);
        padding-inline: calc(var(--unit) * 4);
        font: inherit;
        font-size: var(--text);
        line-height: 1;
        white-space: nowrap;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--s1);
        color: var(--fg);
      }

      [data-text='meta'] { font-size: max(var(--text-meta), var(--min-text)); }

      /* structure.css:55 */
      [data-layout] { display: flex; gap: calc(var(--unit) * 2); align-items: center; }
      [data-layout='row'] { flex-flow: row nowrap; }
      [data-layout='stack'] { flex-direction: column; align-items: stretch; gap: calc(var(--unit) * 1.5); }
      [data-layout] * { flex: none; }
      [data-grow] { flex: 1 1 auto; }

      /* ── THE TWO GRID VARIANTS UNDER TEST ────────────────────────────
         `raw` is the pre-F9 spelling (structure.css history: the minimum was
         `calc(var(--unit) * 44)`), `floored` is the shipped fix
         (structure.css:120). Both are `auto-fit`, so both are obliged by
         css-grid-2 §7.2 to name a <fixed-breadth>: `minmax(min-content, 1fr)`
         does not parse inside repeat(auto-fit, …). */
      [data-layout='grid'] { display: grid; align-items: start; gap: calc(var(--unit) * 2); }
      [data-track='raw'] {
        grid-template-columns: repeat(auto-fit, minmax(calc(var(--unit) * 44), 1fr));
      }
      [data-track='floored'] {
        grid-template-columns: repeat(auto-fit, minmax(max(calc(var(--unit) * 44), var(--min-track)), 1fr));
      }
      /* The third candidate: let the CONTENT state the minimum. Legal only
         because it drops auto-fit. */
      [data-track='intrinsic'] {
        grid-template-columns: repeat(3, minmax(min-content, 1fr));
      }
      /* The fourth candidate: no length in the table at all. The count is
         written by the engine after one measurement. */
      [data-track='measured'] {
        --columns: 1;
        grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      }

      [data-fit] { container-type: inline-size; container-name: fitbox; }

      /* ── subgrid: a topology authored once, consumed without numbers ── */
      [data-layout='record-grid'] {
        display: grid;
        grid-template-columns: [label] max-content [value] 1fr;
        gap: calc(var(--unit) * 1.5) calc(var(--unit) * 3);
        align-items: baseline;
      }
      /* Boxless host, exactly as structure.css:32 does it. */
      .host { display: contents; }
      [data-layout='record'] {
        display: grid;
        grid-column: span 2;
        grid-template-columns: subgrid;
        gap: inherit;
        align-items: baseline;
      }

      /* ── multicol, a third derivation-of-a-container-bound site ───────
         `display: block` is stated because the shared `[data-layout]` rule
         sets `display: flex`, and multicol does not apply to a flex
         container: the first version of this probe measured a flex row and
         called it multicol. */
      [data-layout='columns'] {
        display: block;
        columns: calc(var(--unit) * 44);
        column-gap: calc(var(--unit) * 4);
      }

      /* ── an explicit max-* bound, a fourth site: no automatic minimum ── */
      [data-cap] {
        max-block-size: calc(var(--unit) * 10);
      }

      /* ── aspect-ratio: a bound WITH an automatic content minimum ────── */
      [data-media] { aspect-ratio: 16 / 9; display: grid; align-content: end; background: #eee; }

      /* probe scaffolding — never measured as layout */
      .rig { inline-size: 320px; outline: 1px solid #ccc; margin-block: 4px; }
      .sandbox { position: absolute; visibility: hidden; inset-block-start: 0; inline-size: 10000px; }
      body { margin: 0; font-family: system-ui, sans-serif; }
      section { padding: 8px; }
      h2 { font: 600 13px/1.2 system-ui; margin: 12px 0 4px; }
    </style>
  </head>
  <body>
    <section id="rigs"></section>
    <div class="sandbox" id="sandbox"></div>

    <script>
      /* ══════════════════════════════════════════════════════════════════
         Measurement helpers. Every number reported below is a rect or a
         resolved computed value read from a rendered node — never a
         re-derivation of the table in JavaScript.
         ══════════════════════════════════════════════════════════════════ */

      const DENSITIES = ['comfortable', 'compact', 'dense'];
      const INPUTS = ['pointer', 'touch'];
      const px = (v) => Math.round(v * 100) / 100;
      const sandbox = document.getElementById('sandbox');
      const rigs = document.getElementById('rigs');

      /** Resolve a CSS length EXPRESSION in a given context, with no layout
       *  pressure of any kind. This is what makes the table check honest: the
       *  number measured is the table's assertion, not the outcome of a fight
       *  between the assertion and the available space. */
      function resolveLength(density, input, expr) {
        const ctx = document.createElement('div');
        ctx.dataset.density = density;
        ctx.dataset.input = input;
        const el = document.createElement('div');
        el.style.inlineSize = expr;
        el.style.blockSize = '1px';
        ctx.append(el);
        sandbox.append(ctx);
        const w = el.getBoundingClientRect().width;
        ctx.remove();
        return px(w);
      }

      /** Max-content extent of a piece of declared markup, in a context, with
       *  no constraint. This is the floor side of the check. */
      function resolveMaxContent(density, input, html) {
        const ctx = document.createElement('div');
        ctx.dataset.density = density;
        ctx.dataset.input = input;
        ctx.style.inlineSize = 'max-content';
        ctx.innerHTML = html;
        sandbox.append(ctx);
        const el = ctx.firstElementChild;
        const r = el.getBoundingClientRect();
        const out = { inline: px(r.width), block: px(r.height) };
        ctx.remove();
        return out;
      }

      function computed(el, prop) {
        return getComputedStyle(el).getPropertyValue(prop).trim();
      }

      /** F8's predicate, node-local: content painting outside its own box. */
      function crushedNodes(root) {
        const out = [];
        for (const el of root.querySelectorAll('*')) {
          if (!el.checkVisibility?.()) continue;
          const r = el.getBoundingClientRect();
          if (r.width === 0 && r.height === 0) continue;
          if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow === 'visible') {
            out.push({
              tag: el.tagName.toLowerCase(),
              decl: el.dataset.appearance || el.dataset.text || el.dataset.layout || '',
              inline: px(r.width),
              contentInline: el.scrollWidth,
            });
          }
        }
        return out;
      }

      const results = {};

      /* ────────────────────────────────────────────────────────────────
         1. FEATURE SURFACE — measured, not assumed.
         ──────────────────────────────────────────────────────────────── */
      results.features = (() => {
        const s = (p, v) => {
          try { return CSS.supports(p, v); } catch { return false; }
        };
        const out = {
          ua: navigator.userAgent,
          subgrid: s('grid-template-columns', 'subgrid'),
          'reading-flow': s('reading-flow', 'flex-visual'),
          'reading-order': s('reading-order', '2'),
          'field-sizing': s('field-sizing', 'content'),
          'contain-intrinsic-size': s('contain-intrinsic-size', 'auto 200px'),
          'content-visibility': s('content-visibility', 'auto'),
          'aspect-ratio': s('aspect-ratio', '16 / 9'),
          'inline-size: stretch': s('inline-size', 'stretch'),
          'inline-size: fit-content': s('inline-size', 'fit-content'),
          'fit-content()': s('grid-template-columns', 'fit-content(20ch)'),
          'text-wrap: pretty': s('text-wrap', 'pretty'),
          'anchor-name': s('anchor-name', '--a'),
          'position-area': s('position-area', 'top'),
          'container-type: scroll-state': s('container-type', 'scroll-state'),
          'interpolate-size': s('interpolate-size', 'allow-keywords'),
          'calc-size()': s('inline-size', 'calc-size(auto, size)'),
          'masonry (grid-template-rows)': s('grid-template-rows', 'masonry'),
          'item-flow': s('item-flow', 'row masonry'),
          cqi: s('inline-size', '50cqi'),
          cqb: s('block-size', '50cqb'),
          /* The invalidity that forces F9 to exist at all (css-grid-2 §7.2). */
          'auto-fit + minmax(min-content,1fr)': s(
            'grid-template-columns',
            'repeat(auto-fit, minmax(min-content, 1fr))',
          ),
          'auto-fit + minmax(fixed,1fr)': s(
            'grid-template-columns',
            'repeat(auto-fit, minmax(176px, 1fr))',
          ),
          'auto-fit + minmax(auto,1fr)': s(
            'grid-template-columns',
            'repeat(auto-fit, minmax(auto, 1fr))',
          ),
          'auto-fit + fit-content()': s(
            'grid-template-columns',
            'repeat(auto-fit, fit-content(176px))',
          ),
        };
        return out;
      })();

      /* Can a style query compare a NUMBER? (i.e. can the table branch on the
         magnitude of --unit rather than on a name?) Measured behaviourally,
         because CSS.supports has no at-rule form for this. */
      results.styleQuery = (() => {
        const sheet = new CSSStyleSheet();
        const probe = (rule) => {
          try {
            sheet.replaceSync(rule);
            return sheet.cssRules.length > 0 && sheet.cssRules[0].cssRules.length > 0;
          } catch {
            return false;
          }
        };
        const parsedEquality = probe('@container style(--density-name: dense) { #q { color: red } }');
        const parsedRange = probe('@container style(--unit > 3px) { #q { color: red } }');
        const parsedRangeTyped = probe('@container style(--unit-count > 3) { #q { color: red } }');
        const parsedSize = probe('@container (inline-size > 400px) { #q { color: red } }');
        return { parsedEquality, parsedRange, parsedRangeTyped, parsedSize };
      })();

      /* ────────────────────────────────────────────────────────────────
         2. THE F9 MATRIX — a unit-derived grid track vs the floors the same
            table puts inside it, at every density, in 320px of space.
         ──────────────────────────────────────────────────────────────── */

      /* The label length is a fixture parameter, because the thing that does
         NOT shrink with density is the intrinsic width of text: the unit halves
         from comfortable to dense (4px -> 2px, x0.50) while the type ramp only
         goes 14px -> 12px (x0.857). A unit-proportional track therefore loses
         space twice as fast as its contents give it back, and the density at
         which that crosses over is a function of how long the label is. That
         crossover is the whole of F9, so it is swept rather than assumed. */
      const LABELS = {
        short: 'Go',
        medium: 'Get started',
        long: 'Start your free trial',
      };
      const cell = (label) => `
        <div data-layout="stack">
          <span data-text="meta">Ambient context</span>
          <button data-appearance="action">${label}</button>
        </div>`;
      const CELL = cell(LABELS.medium);

      function buildGrid(density, input, track, width, label) {
        const rig = document.createElement('div');
        rig.className = 'rig';
        rig.style.inlineSize = `${width}px`;
        rig.dataset.density = density;
        rig.dataset.input = input;
        rig.dataset.fit = '';
        const c = cell(label ?? LABELS.medium);
        rig.innerHTML = `<div data-layout="grid" data-track="${track}">${c}${c}${c}</div>`;
        rigs.append(rig);
        return rig;
      }

      results.f9 = [];
      for (const [labelName, label] of Object.entries(LABELS)) {
        for (const density of DENSITIES) {
          for (const input of INPUTS) {
            for (const track of ['raw', 'floored']) {
              const rig = buildGrid(density, input, track, 320, label);
              const grid = rig.firstElementChild;
              const unit = computed(grid, '--unit');
              const tracks = computed(grid, 'grid-template-columns')
                .split(' ')
                .map((v) => px(parseFloat(v)));
              const control = grid.querySelector('[data-appearance="action"]');
              const cRect = control.getBoundingClientRect();
              const want = resolveMaxContent(density, input, cell(label));
              const crushed = crushedNodes(grid);
              results.f9.push({
                label: labelName,
                density,
                input,
                track,
                unit,
                minTarget: computed(grid, '--min-target'),
                declaredTrackMin: resolveLength(
                  density,
                  input,
                  track === 'raw'
                    ? 'calc(var(--unit) * 44)'
                    : 'max(calc(var(--unit) * 44), var(--min-track))',
                ),
                columns: tracks.length,
                usedTrack: tracks[0],
                controlInline: px(cRect.width),
                controlContentInline: control.scrollWidth,
                cellWants: want.inline,
                gridOverflows: grid.scrollWidth > grid.clientWidth + 1,
                gridScroll: grid.scrollWidth,
                gridClient: grid.clientWidth,
                crushedCount: crushed.length,
                crushed,
              });
              rig.remove();
            }
          }
        }
      }

      /* ────────────────────────────────────────────────────────────────
         3. THE TABLE CONSISTENCY CHECK (proposed N710 — N700 is allocated to
            the competing-primary-actions rule), implemented.
            Reads: the declared BOUNDS registry and the declared FLOORS
            registry, each resolved in an unconstrained probe, for the full
            density × input cross product.
            Asserts: bound_used >= floor_used for every (bound, floor) pair
            the table can place together.
            Fixture that proves it can fail: the `raw` track, which is the
            pre-fix spelling of structure.css:120.
         ──────────────────────────────────────────────────────────────── */

      const BOUNDS = [
        { id: 'grid-track/raw', expr: 'calc(var(--unit) * 44)', holds: ['cell'] },
        {
          id: 'grid-track/floored',
          expr: 'max(calc(var(--unit) * 44), var(--min-track))',
          holds: ['cell'],
        },
        { id: 'menu-max-inline/raw', expr: 'calc(var(--unit) * 60)', holds: ['menu-item'] },
        {
          id: 'menu-max-inline/floored',
          expr: 'max(calc(var(--unit) * 60), var(--min-track))',
          holds: ['menu-item'],
        },
        { id: 'multicol-column-width', expr: 'calc(var(--unit) * 44)', holds: ['cell'] },
      ];

      /* A floor is what the table INSISTS on. Content width is app data, so a
         floor is declared as a nominal extent: the widest thing the table
         itself promises will fit. `12ch` of the role's own font size is the
         nominal label; --min-target is the atomic floor. */
      const FLOORS = {
        cell: {
          label: 'stacked cell: control floor + nominal 12ch label',
          expr: 'max(var(--min-target), calc(var(--unit) * 8 + 12ch))',
          fontFrom: 'var(--text)',
        },
        'menu-item': {
          label: 'menu item: target floor + nominal 10ch label',
          expr: 'max(var(--min-target), calc(var(--unit) * 4 + 10ch))',
          fontFrom: 'var(--text)',
        },
      };

      function resolveFloor(density, input, key) {
        const f = FLOORS[key];
        const ctx = document.createElement('div');
        ctx.dataset.density = density;
        ctx.dataset.input = input;
        const el = document.createElement('div');
        el.style.fontSize = f.fontFrom;
        el.style.inlineSize = f.expr;
        el.style.blockSize = '1px';
        ctx.append(el);
        sandbox.append(ctx);
        const w = px(el.getBoundingClientRect().width);
        ctx.remove();
        return w;
      }

      results.tableConsistency = [];
      for (const b of BOUNDS) {
        for (const density of DENSITIES) {
          for (const input of INPUTS) {
            const bound = resolveLength(density, input, b.expr);
            for (const key of b.holds) {
              const floor = resolveFloor(density, input, key);
              results.tableConsistency.push({
                bound: b.id,
                density,
                input,
                boundPx: bound,
                floorKey: key,
                floorPx: floor,
                verdict: bound + 0.5 >= floor ? 'ok' : 'FAIL',
                deficit: bound >= floor ? 0 : px(floor - bound),
              });
            }
          }
        }
      }

      /* ────────────────────────────────────────────────────────────────
         4. THE INTRINSIC ALTERNATIVE — does dropping auto-fit buy
            self-consistency by construction?
         ──────────────────────────────────────────────────────────────── */
      results.intrinsicTrack = [];
      for (const [labelName, label] of Object.entries(LABELS)) {
        for (const density of DENSITIES) {
          const rig = buildGrid(density, 'touch', 'intrinsic', 320, label);
          const grid = rig.firstElementChild;
          const tracks = computed(grid, 'grid-template-columns')
            .split(' ')
            .map((v) => px(parseFloat(v)));
          results.intrinsicTrack.push({
            label: labelName,
            density,
            tracks,
            columns: tracks.length,
            gridOverflows: grid.scrollWidth > grid.clientWidth + 1,
            gridScroll: grid.scrollWidth,
            gridClient: grid.clientWidth,
            crushed: crushedNodes(grid),
          });
          rig.remove();
        }
      }

      /* ────────────────────────────────────────────────────────────────
         4b. THE MEASURED ALTERNATIVE — the column COUNT as a measured
             decision rather than a derived length.

             css-grid-2 §7.2 forbids an intrinsic minimum inside
             repeat(auto-fit, …), so CSS cannot ask "how many of these fit".
             But the engine can: measure the cell's max-content extent once
             per context, divide the container by it, and publish the answer
             as --columns. The track then needs NO length at all —
             `repeat(var(--columns), minmax(0, 1fr))` — so there is no
             unit-derived container bound left to contradict a content floor.
             This is the candidate that makes the F9 class unreachable by
             construction rather than caught by a check.
         ──────────────────────────────────────────────────────────────── */
      results.measuredColumns = [];
      for (const [labelName, label] of Object.entries(LABELS)) {
        for (const density of DENSITIES) {
          for (const input of INPUTS) {
            for (const width of [320, 480, 720, 1080]) {
              const rig = buildGrid(density, input, 'measured', width, label);
              const grid = rig.firstElementChild;
              /* ONE measurement, in the same context the cells will live in. */
              const want = resolveMaxContent(density, input, cell(label)).inline;
              const gap = parseFloat(computed(grid, 'column-gap')) || 0;
              const avail = grid.clientWidth;
              const n = Math.max(1, Math.floor((avail + gap) / (want + gap)));
              grid.style.setProperty('--columns', String(n));
              void grid.offsetWidth;
              const tracks = computed(grid, 'grid-template-columns')
                .split(' ')
                .map((v) => px(parseFloat(v)));
              results.measuredColumns.push({
                label: labelName,
                density,
                input,
                width,
                cellWants: want,
                columns: n,
                usedTrack: tracks[0],
                gridOverflows: grid.scrollWidth > grid.clientWidth + 1,
                gridScroll: grid.scrollWidth,
                gridClient: grid.clientWidth,
                crushed: crushedNodes(grid),
              });
              rig.remove();
            }
          }
        }
      }

      /* ────────────────────────────────────────────────────────────────
         5. SUBGRID — cross-component rhythm without shared numbers.
            Two independent "components", each a boxless host wrapping a
            subgrid. Neither names a track, a width or the other's content.
         ──────────────────────────────────────────────────────────────── */
      results.subgrid = (() => {
        const rig = document.createElement('div');
        rig.className = 'rig';
        rig.style.inlineSize = '420px';
        rig.dataset.density = 'comfortable';
        rig.dataset.input = 'pointer';
        rig.innerHTML = `
          <div data-layout="record-grid">
            <span class="host"><div data-layout="record">
              <span data-text="meta" data-k>Shortname</span><span data-v>ok</span>
            </div></span>
            <span class="host"><div data-layout="record">
              <span data-text="meta" data-k>A much longer key</span><span data-v>also ok</span>
            </div></span>
            <span class="host"><div data-layout="record">
              <span data-text="meta" data-k>Mid key</span><span data-v>third</span>
            </div></span>
          </div>`;
        rigs.append(rig);
        const parent = rig.firstElementChild;
        const keys = [...rig.querySelectorAll('[data-k]')].map((el) =>
          px(el.getBoundingClientRect().left),
        );
        const values = [...rig.querySelectorAll('[data-v]')].map((el) =>
          px(el.getBoundingClientRect().left),
        );
        const subgridBoxes = [...rig.querySelectorAll('[data-layout="record"]')].map((el) =>
          px(el.getBoundingClientRect().width),
        );
        const parentTracks = computed(parent, 'grid-template-columns');
        const childTracks = computed(rig.querySelector('[data-layout="record"]'), 'grid-template-columns');
        const out = {
          parentTracks,
          childTracks,
          keyLefts: keys,
          valueLefts: values,
          subgridWidths: subgridBoxes,
          keysAligned: new Set(keys).size === 1,
          valuesAligned: new Set(values).size === 1,
          hostIsContents: computed(rig.querySelector('.host'), 'display'),
        };
        rig.remove();
        return out;
      })();

      /* Does subgrid survive an auto-fit parent — i.e. can it work with a
         DERIVED topology rather than an authored one? */
      results.subgridAutoFit = (() => {
        const rig = document.createElement('div');
        rig.className = 'rig';
        rig.style.inlineSize = '420px';
        rig.dataset.density = 'comfortable';
        rig.innerHTML = `
          <div data-layout="grid" data-track="floored" style="grid-auto-flow: row">
            <span class="host"><div data-layout="record" style="grid-column: span 2">
              <span data-k>Key</span><span data-v>value</span>
            </div></span>
            <span class="host"><div data-layout="record" style="grid-column: span 2">
              <span data-k>Much longer key here</span><span data-v>v2</span>
            </div></span>
          </div>`;
        rigs.append(rig);
        const parent = rig.firstElementChild;
        const keys = [...rig.querySelectorAll('[data-k]')].map((el) => px(el.getBoundingClientRect().left));
        const values = [...rig.querySelectorAll('[data-v]')].map((el) => px(el.getBoundingClientRect().left));
        const out = {
          parentTracks: computed(parent, 'grid-template-columns'),
          keyLefts: keys,
          valueLefts: values,
          valuesAligned: new Set(values).size === 1,
        };
        rig.remove();
        return out;
      })();

      /* ────────────────────────────────────────────────────────────────
         5b. THE AUTOMATIC MINIMUM — the construction rule, and its
             falsifying fixture.

             The claim: a container bound cannot state an F9 contradiction
             while it retains its automatic content-based minimum, because
             the automatic minimum IS floor propagation, implemented by the
             UA. `aspect-ratio` is the clean case (css-sizing-4: a box with a
             preferred aspect ratio has an automatic minimum in the ratio-
             dependent axis), so it is measured twice: once as declared, and
             once with `min-block-size: 0` — the fixture that proves the
             measurement can see the contradiction when the minimum is gone.

             `[data-cap]` is the same experiment on an explicit `max-*`,
             which has NO automatic minimum by construction and is therefore
             expected to fail at dense.
         ──────────────────────────────────────────────────────────────── */
      results.automaticMinimum = [];
      for (const suppress of ['', 'min-block-size:0;']) {
        for (const density of DENSITIES) {
          const rig = document.createElement('div');
          rig.className = 'rig';
          rig.style.inlineSize = '64px';
          rig.dataset.density = density;
          rig.dataset.input = 'touch';
          rig.innerHTML = `<div data-media style="${suppress}"><button data-appearance="action">Play</button></div>`;
          rigs.append(rig);
          const media = rig.firstElementChild;
          const control = media.querySelector('button');
          const mr = media.getBoundingClientRect();
          const cr = control.getBoundingClientRect();
          results.automaticMinimum.push({
            site: 'aspect-ratio',
            minimum: suppress ? 'suppressed (min-block-size: 0)' : 'automatic (min-block-size: auto)',
            density,
            ratioWouldGive: px((64 * 9) / 16),
            boundBlock: px(mr.height),
            controlBlock: px(cr.height),
            /* The claim's own box: does the control's rect fit inside the
               bound's rect? scrollHeight is NOT used here, because a child
               pinned by `align-content: end` overflows towards block-start
               and scrollHeight cannot see block-start overflow. */
            escapes: px(cr.height) > px(mr.height) + 0.5,
            escapeBy: px(Math.max(0, cr.height - mr.height)),
          });
          rig.remove();
        }
      }
      for (const density of DENSITIES) {
        const rig = document.createElement('div');
        rig.className = 'rig';
        rig.style.inlineSize = '200px';
        rig.dataset.density = density;
        rig.dataset.input = 'touch';
        rig.innerHTML = `<div data-cap data-layout="stack"><button data-appearance="action">Play</button></div>`;
        rigs.append(rig);
        const box = rig.firstElementChild;
        const control = box.querySelector('button');
        results.automaticMinimum.push({
          site: 'max-block-size',
          minimum: 'none available (max-* has no automatic minimum)',
          density,
          declaredMax: px(parseFloat(computed(box, 'max-block-size'))),
          boundBlock: px(box.getBoundingClientRect().height),
          controlBlock: px(control.getBoundingClientRect().height),
          escapes: box.scrollHeight > box.clientHeight + 1,
          escapeBy: Math.max(0, box.scrollHeight - box.clientHeight),
        });
        rig.remove();
      }

      /* ────────────────────────────────────────────────────────────────
         6. INTRINSIC SIZING KEYWORDS — used values in 300px of space.
         ──────────────────────────────────────────────────────────────── */
      results.sizingKeywords = (() => {
        const rig = document.createElement('div');
        rig.className = 'rig';
        rig.style.inlineSize = '300px';
        rig.dataset.density = 'comfortable';
        const cases = ['auto', 'min-content', 'max-content', 'fit-content', 'stretch', 'fit-content(12ch)', '100cqi'];
        rig.dataset.fit = '';
        rig.innerHTML = cases
          .map(
            (c) =>
              `<div data-case="${c}" style="inline-size:${c}">Intrinsic sizing keywords under measurement</div>`,
          )
          .join('');
        rigs.append(rig);
        const out = {};
        for (const el of rig.children) {
          out[el.dataset.case] = px(el.getBoundingClientRect().width);
        }
        rig.remove();
        return out;
      })();

      /* ────────────────────────────────────────────────────────────────
         7. aspect-ratio AS AN F9 SITE — a bound on one axis derived from
            the other, meeting a floor it does not know about.
         ──────────────────────────────────────────────────────────────── */
      results.aspectRatio = [];
      for (const density of DENSITIES) {
        for (const input of INPUTS) {
          for (const width of [320, 160, 96, 64]) {
            const rig = document.createElement('div');
            rig.className = 'rig';
            rig.style.inlineSize = `${width}px`;
            rig.dataset.density = density;
            rig.dataset.input = input;
            rig.innerHTML = `<div data-media><button data-appearance="action">Play</button></div>`;
            rigs.append(rig);
            const media = rig.firstElementChild;
            const control = media.querySelector('button');
            const r = media.getBoundingClientRect();
            results.aspectRatio.push({
              density,
              input,
              width,
              derivedBlock: px(r.height),
              controlBlock: px(control.getBoundingClientRect().height),
              overflows: media.scrollHeight > media.clientHeight + 1,
              scrollBlock: media.scrollHeight,
              clientBlock: media.clientHeight,
            });
            rig.remove();
          }
        }
      }

      /* ────────────────────────────────────────────────────────────────
         8. MULTICOL AS AN F9 SITE — column-width derived from --unit.
         ──────────────────────────────────────────────────────────────── */
      results.multicol = [];
      for (const density of DENSITIES) {
        for (const input of INPUTS) {
          const rig = document.createElement('div');
          rig.className = 'rig';
          rig.style.inlineSize = '320px';
          rig.dataset.density = density;
          rig.dataset.input = input;
          const LONG = cell(LABELS.long);
          rig.innerHTML = `<div data-layout="columns">${LONG}${LONG}${LONG}</div>`;
          rigs.append(rig);
          const col = rig.firstElementChild;
          const cs = getComputedStyle(col);
          const control = col.querySelector('[data-appearance="action"]');
          /* A column box is NOT an element. So the per-node crush predicate
             — content wider than its own box — can never see a multicol
             overflow: the overflowing item is at its own content width and it
             is the column box, which has no DOM node, that is too narrow.
             The claim has to be measured on the boxes that DO exist: the
             items' rects against the container's rect. */
          const rigRight = px(rig.getBoundingClientRect().right);
          /* Two-dimensional, and that correction is the point. The first
             version compared inline extents only and reported 3 overlaps for
             a SINGLE-column layout, where the three items are stacked
             vertically and share the whole inline axis by design. An overlap
             claim is about area, so it has to be measured as area. */
          const rects = [...col.querySelectorAll('[data-appearance="action"]')].map((b) => {
            const r = b.getBoundingClientRect();
            return { l: px(r.left), r: px(r.right), t: px(r.top), b: px(r.bottom) };
          });
          let overlaps = 0;
          for (let a = 0; a < rects.length; a++) {
            for (let b = a + 1; b < rects.length; b++) {
              const A = rects[a];
              const B = rects[b];
              if (A.l < B.r - 0.5 && B.l < A.r - 0.5 && A.t < B.b - 0.5 && B.t < A.b - 0.5) overlaps++;
            }
          }
          /* The used column width has no computed-style form, so it is read
             back from the geometry: the number of distinct item origins is
             the number of columns actually generated. */
          const columnsUsed = new Set(rects.map((x) => x.l)).size;
          results.multicol.push({
            density,
            input,
            columnWidth: cs.columnWidth,
            derivedColumnWidth: resolveLength(density, input, 'calc(var(--unit) * 44)'),
            columnsUsed,
            usedColumnWidth: px(
              (col.clientWidth - (columnsUsed - 1) * (parseFloat(cs.columnGap) || 0)) / columnsUsed,
            ),
            controlInline: px(control.getBoundingClientRect().width),
            controlContentInline: control.scrollWidth,
            crushedNodes: crushedNodes(col).length,
            itemOverlaps: overlaps,
            itemsEscapeContainer: rects.some((x) => x.r > rigRight + 0.5),
            escapeBy: px(Math.max(0, Math.max(...rects.map((x) => x.r)) - rigRight)),
            colScroll: col.scrollWidth,
            colClient: col.clientWidth,
          });
          rig.remove();
        }
      }

      /* ────────────────────────────────────────────────────────────────
         9. FLEX min-width:auto — the F8 crush hazard, quantified.
         ──────────────────────────────────────────────────────────────── */
      results.flexCrush = (() => {
        const mk = (licence) => {
          const rig = document.createElement('div');
          rig.className = 'rig';
          rig.style.inlineSize = '160px';
          rig.dataset.density = 'comfortable';
          rig.innerHTML = `<div data-layout="row" style="flex-flow: row nowrap">
            <span style="flex:1 1 auto;white-space:nowrap;${licence}" data-probe
              >A rather long piece of grow text that will not fit</span
            >
            <button data-appearance="action" style="flex:none">Reply</button>
          </div>`;
          rigs.append(rig);
          const row = rig.firstElementChild;
          const probe = row.querySelector('[data-probe]');
          const out = {
            licence: licence || '(none: automatic minimum kept)',
            rowScroll: row.scrollWidth,
            rowClient: row.clientWidth,
            rowOverflows: row.scrollWidth > row.clientWidth + 1,
            probeInline: px(probe.getBoundingClientRect().width),
            probeContentInline: probe.scrollWidth,
            crushed: crushedNodes(row),
          };
          rig.remove();
          return out;
        };
        return [mk(''), mk('min-inline-size:0;')];
      })();

      /* ────────────────────────────────────────────────────────────────
         10. ORDER vs DOM vs READING FLOW. The tab order half is measured
             by the driver pressing Tab for real; this side records the DOM
             order and the visual order.
         ──────────────────────────────────────────────────────────────── */
      const flowRig = document.createElement('div');
      flowRig.className = 'rig';
      flowRig.id = 'flow';
      flowRig.dataset.density = 'comfortable';
      flowRig.innerHTML = `
        <div id="flowbox" data-layout="row" style="flex-direction: row-reverse; reading-flow: normal">
          <button data-appearance="action" id="f1" style="order:1">one</button>
          <button data-appearance="action" id="f2">two</button>
          <button data-appearance="action" id="f3">three</button>
        </div>`;
      rigs.append(flowRig);
      window.__flow = () => {
        const box = document.getElementById('flowbox');
        const items = [...box.children];
        return {
          readingFlow: getComputedStyle(box).getPropertyValue('reading-flow').trim(),
          domOrder: items.map((el) => el.id),
          visualOrder: items
            .map((el) => ({ id: el.id, x: px(el.getBoundingClientRect().left) }))
            .sort((a, b) => a.x - b.x)
            .map((o) => o.id),
        };
      };
      window.__setFlow = (v) => {
        document.getElementById('flowbox').style.readingFlow = v;
        return window.__flow();
      };
      /* Ordinal groups on the children, which is the mechanism that lets
         attention order be declared without touching the DOM or the visual
         order. Driven by the harness so the tab order is measured by real key
         presses rather than by reading a property back. */
      window.__setReadingOrder = (orders) => {
        const box = document.getElementById('flowbox');
        box.style.readingFlow = 'source-order';
        [...box.children].forEach((el, i) => {
          el.style.readingOrder = String(orders[i]);
        });
        return [...box.children].map((el) => `${el.id}=${getComputedStyle(el).readingOrder}`);
      };

      /* ── data-priority AS FOCUS ORDER, with no new declaration ────────
         `data-priority` already exists to order WHEN a degradation strategy
         is spent (F11). `reading-order` with a typed `attr()` turns the same
         declaration into attention order, in the table, with no JavaScript
         and no second vocabulary. The tab order is measured by real key
         presses; the computed values are recorded alongside so a divergence
         between "what the table said" and "where focus went" is visible. */
      const prioRig = document.createElement('div');
      prioRig.className = 'rig';
      prioRig.dataset.density = 'comfortable';
      prioRig.innerHTML = `
        <div id="priobox" data-layout="row" style="reading-flow: source-order">
          <button data-appearance="action" id="p1" data-priority="4">p4</button>
          <button data-appearance="action" id="p2" data-priority="1">p1</button>
          <button data-appearance="action" id="p3" data-priority="3">p3</button>
        </div>`;
      rigs.append(prioRig);
      const prioStyle = document.createElement('style');
      prioStyle.textContent = `
        #priobox > [data-priority] { reading-order: attr(data-priority type(<integer>), 0); }`;
      document.head.append(prioStyle);
      window.__priority = () => {
        const box = document.getElementById('priobox');
        return {
          supportsAttrType: CSS.supports('reading-order', 'attr(data-priority type(<integer>), 0)'),
          domOrder: [...box.children].map((el) => el.id),
          declared: [...box.children].map((el) => `${el.id}=${el.dataset.priority}`),
          computedReadingOrder: [...box.children].map(
            (el) => `${el.id}=${computed(el, 'reading-order')}`,
          ),
        };
      };

      /* ────────────────────────────────────────────────────────────────
         11. THE THRESHOLD PROBLEM — is a container query's number
             authored, or derived?

             `@container (inline-size < 30em)` looks like a breakpoint but is
             not one: font-relative units in a container condition resolve
             against the QUERY CONTAINER's own font, which the density axis
             already sets. So the same rule moves with the context. `rem` is
             the control: root-relative, therefore NOT density-responsive.
             Both are measured at one fixed container width, so any
             difference between the rows is the unit's doing.
         ──────────────────────────────────────────────────────────────── */
      results.thresholds = (() => {
        const st = document.createElement('style');
        st.textContent = `
          .cqu { container-type: inline-size; container-name: cqu; inline-size: 320px; font-size: var(--text); }
          .cqu > b { color: rgb(1, 1, 1); }
          @container cqu (inline-size < 24em)  { .cqu > .em24  { color: rgb(0, 255, 0) } }
          @container cqu (inline-size < 45ch)  { .cqu > .ch45  { color: rgb(0, 255, 0) } }
          @container cqu (inline-size < 24rem) { .cqu > .rem24 { color: rgb(0, 255, 0) } }
          @container cqu (inline-size < 320px) { .cqu > .px320 { color: rgb(0, 255, 0) } }`;
        document.head.append(st);
        const out = [];
        for (const density of DENSITIES) {
          const ctx = document.createElement('div');
          ctx.dataset.density = density;
          ctx.dataset.input = 'pointer';
          const box = document.createElement('div');
          box.className = 'cqu';
          box.innerHTML = ['em24', 'ch45', 'rem24', 'px320']
            .map((c) => `<b class="${c}">x</b>`)
            .join('');
          ctx.append(box);
          rigs.append(ctx);
          const row = { density, fontSize: computed(box, 'font-size'), containerInline: 320 };
          for (const el of box.children) {
            row[el.className] = computed(el, 'color') === 'rgb(0, 255, 0)';
          }
          out.push(row);
          ctx.remove();
        }
        st.remove();
        return out;
      })();


      window.__probe = results;
      document.title = 'probe ready';
    </script>
  </body>
</html>
