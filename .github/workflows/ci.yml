name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      # Cheap and first: a pnpm/node/Bun pin that disagrees with mise.toml means a
      # local green run and a CI green run are not testing the same toolchain.
      - name: Check toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install preview browser
        run: pnpm --filter @nisli/www exec playwright install --with-deps chromium

      - name: Browser-render every UI preview
        run: pnpm --filter @nisli/www test:previews

      - name: UI package-shape e2e
        run: pnpm --filter @nisli/ui e2e:pack

      - name: Test
        run: pnpm test

  published-ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Published @nisli/ui consumer e2e
        run: pnpm --filter @nisli/ui e2e:npm
