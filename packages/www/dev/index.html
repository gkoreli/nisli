<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nisli — reactive web components, shadcn-style UI you own</title>
    <meta
      name="description"
      content="nisli is a reactive web-component framework; @nisli/ui is its shadcn-style component library, installed as source you own."
    />
    <script>
      try {
        if (
          localStorage.theme === 'dark' ||
          (!('theme' in localStorage) && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div class="fixed top-4 right-4 z-[200]">
      <button
        id="theme-toggle"
        aria-label="Toggle dark mode"
        class="rounded-md border bg-background px-3 py-1.5 text-sm font-medium text-foreground shadow-xs hover:bg-accent"
      >
        Theme
      </button>
    </div>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
