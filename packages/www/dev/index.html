<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nisli — the reactive web-component framework</title>
    <meta
      name="description"
      content="nisli is a reactive web-component framework; @nisli/ui is its batteries-included component library, copied into your project as source you own."
    />
    <script>
      try {
        if (
          localStorage.theme === 'dark' ||
          (!('theme' in localStorage) && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <!-- The site chrome (nav with #theme-toggle, footer) renders inside #app via
         the AppRouter outlet; enhancement is wired in main.ts by delegation. -->
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
